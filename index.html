<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Drill 1-Basic Calculator</title>
    <link rel="stylesheet" href="style.css">

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>

    <div class="container">
        <h1>Basic Calculator</h1>
        <p>Click the button to display the product of 8 and 9</p>
        <p id="paragraph">The answer is:</p>
        <button type="button" class="btn btn-warning" onclick="
        let x = 8;
        let y = 9;
        let z = x * y;
        document.getElementById('paragraph').innerHTML = 'The answer is: ' + z;"> Calculate</button>
        <button type="button" class="btn btn-warning" onclick="window.location.reload()">Refresh</button>
    </div>

    
</body>
</html>
